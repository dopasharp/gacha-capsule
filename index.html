<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가차 캡슐 | 오늘의 작은 행운</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#fffdf5,#ffe6e9 75%);font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#784f5a;text-align:center;min-height:100vh}header{padding:30px 12px 0}h1{margin:0;font-size:clamp(28px,6vw,43px);color:#dd7395}p{margin:8px}main{max-width:720px;margin:auto;padding:10px 18px 50px}.machine{position:relative;width:min(340px,90vw);height:490px;margin:22px auto 10px;filter:drop-shadow(12px 22px 15px #bf899266)}.top{position:absolute;left:26px;top:0;width:288px;height:290px;border:13px solid #f49cb4;border-radius:72px 72px 45px 45px;background:linear-gradient(120deg,#fff9fb9c,#f5a1b84d 60%,#fff8);box-shadow:inset 9px 8px 12px #fff9,inset -8px -5px 13px #d6719060,0 7px 0 #d87d99;overflow:hidden}.shine{position:absolute;top:13px;left:24px;width:65px;height:220px;background:#fff7;transform:rotate(18deg);border-radius:50%;filter:blur(9px)}.balls{position:absolute;inset:30px 10px 10px}.ball{position:absolute;width:73px;height:73px;border-radius:50%;border:2px solid #fff9;box-shadow:inset -9px -12px 10px #0001,inset 8px 10px 12px #fff9,2px 5px 6px #a36b7955;background:linear-gradient(#ffffff80 48%,var(--c) 49%)}.ball:after{content:'';position:absolute;top:47%;left:0;right:0;border-top:2px solid #fff9}.base{position:absolute;left:19px;top:277px;width:302px;height:202px;border-radius:35px 35px 42px 42px;background:linear-gradient(110deg,#ffcfdd,#f397b2 60%,#d97297);border:8px solid #f5a3bb;box-shadow:inset 8px 6px 9px #fff9,inset -9px -9px 10px #ae527455}.coin{position:absolute;left:39px;top:40px;width:70px;height:15px;border:5px solid #bc6884;border-radius:15px;background:#6d4056}.handle{position:absolute;right:41px;top:27px;width:95px;height:95px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#ffdbe5 55%,#cc7a98);border:9px solid #d57f9d;box-shadow:4px 6px 6px #8e516655;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}.grip{width:66px;height:19px;background:linear-gradient(#fff,#d85f8d);border:4px solid #c66c8c;border-radius:20px;box-shadow:2px 4px 4px #9c5772}.handle.spin .grip{animation:spin .8s ease-in-out}@keyframes spin{to{transform:rotate(720deg)}}.door{position:absolute;left:109px;bottom:20px;width:85px;height:57px;background:linear-gradient(#9e536e,#7e3c55);border:8px solid #ffd7e3;border-radius:12px 12px 30px 30px;box-shadow:inset 0 10px 10px #51293b}.label{position:absolute;top:11px;left:30px;background:#fff8;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:bold}.feet{position:absolute;bottom:0;left:48px;width:244px;height:23px;border-radius:10px;background:#d57a9a}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{border:0;border-radius:30px;background:linear-gradient(#fff,#ffd6e4);color:#a95376;box-shadow:0 5px 0 #e7a4bb,0 9px 15px #bc8a9b44;padding:14px 22px;font-size:16px;font-weight:800;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 2px 0 #e7a4bb}button:disabled{opacity:.45;cursor:not-allowed}.status{min-height:35px;font-weight:700;color:#be6686;margin:20px auto 5px}.prize{display:none;max-width:450px;margin:25px auto;background:#fffdfb;border:3px solid #f5b3c9;border-radius:26px;padding:25px 18px;box-shadow:0 12px 28px #c77b9450;animation:pop .4s}.prize.show{display:block}@keyframes pop{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}.capsule{font-size:75px;cursor:pointer;display:block;animation:bounce .8s infinite alternate}@keyframes bounce{to{transform:translateY(-9px) rotate(9deg)}}.prize h2{color:#dc7c9b}.note{line-height:1.8;white-space:pre-line;font-size:18px}.history{max-width:470px;margin:35px auto 0;text-align:left;background:#ffffffa8;border-radius:20px;padding:18px}.history h3{text-align:center}.history li{margin:8px 0}footer{font-size:12px;opacity:.6;margin-top:28px}
</style></head><body><header><h1>🎀 가차 캡슐 🎀</h1><p>동전을 넣고 손잡이를 돌려 오늘의 작은 행운을 만나봐!</p></header><main><div class="machine" aria-label="분홍색 캡슐 뽑기 기계"><div class="top"><div class="balls" id="balls"></div><div class="shine"></div></div><div class="base"><div class="label">LUCKY CAPSULE ♡</div><div class="coin"></div><div class="handle" id="handle" role="button" tabindex="0" aria-label="손잡이 돌리기"><div class="grip"></div></div><div class="door"></div></div><div class="feet"></div></div><div class="status" id="status" aria-live="polite">🪙 동전을 넣어 주세요!</div><div class="controls"><button id="insert">🪙 동전 넣기</button><button id="turn" disabled>🔄 손잡이 돌리기</button></div><section class="prize" id="prize"><span class="capsule" id="capsule" role="button" tabindex="0" aria-label="캡슐 열기">🔮</span><h2 id="prizeTitle">캡슐을 눌러 열어봐!</h2><div class="note" id="note"></div><button id="again" style="display:none">한 번 더 뽑기 💗</button></section><section class="history"><h3>💌 나의 편지 수집함</h3><ol id="history"></ol></section><footer>무료 랜덤 운세 게임 · 실제 금전 결제 없음</footer></main>
<script>
const items=[
['오늘의 행운','생각지도 못한 곳에서 작은 기쁨이 찾아올 거야. 눈을 크게 뜨고 찾아봐! 🌷'],
['반짝이는 하루','오늘은 네가 생각하는 것보다 더 반짝이는 날이야. ✨'],
['용기의 편지','조금 떨려도 괜찮아. 한 걸음만 내디뎌 봐. 💌'],
['따뜻한 응원','지금까지 걸어온 길도 충분히 멋져. 오늘의 너를 응원해! 🧸'],
['좋은 소식','기분 좋은 연락이 찾아올지도 몰라. 휴대폰을 살짝 기대해 봐! 📮'],
['휴식의 운세','오늘의 행운 아이템은 포근한 담요. 쉬어가는 시간도 소중해. ☁️'],
['웃음 한 스푼','사소한 일 하나가 널 크게 웃게 할 거야. 🍓'],
['비밀 편지','누군가에게 너의 다정함이 오래 기억되고 있어. 💗'],
['새로운 시작','작은 도전이 새로운 문을 열어 줄 수 있어. 🗝️'],
['행운의 색','오늘의 행운 색깔은 연분홍! 주변에서 찾아봐. 🎀'],
['마음의 날씨','마음에 구름이 껴도 괜찮아. 구름 뒤에는 늘 하늘이 있어. 🌤️'],
['소중한 인연','오랜만에 생각난 사람에게 안부를 전해 보는 건 어때? 🌼'],
['선물 같은 순간','평범한 하루에도 선물 같은 순간이 숨어 있어. 🎁'],
['별빛 메시지','모든 걸 오늘 해내지 않아도 돼. 네 속도로 가면 돼. ⭐'],
['내일의 기대','아직 오지 않은 좋은 일이 너를 기다리고 있을 거야. 🌙']];
const $=id=>document.getElementById(id);let state='ready',picked=null;
const colors=['#ff98b8','#f5d37c','#a5d7f5','#c5b2f6','#a8e7ce','#f6b8a5'];
for(let i=0;i<14;i++){let b=document.createElement('div');b.className='ball';b.style.setProperty('--c',colors[i%colors.length]);b.style.left=(i%4*56+Math.random()*10)+'px';b.style.top=(Math.floor(i/4)*51+Math.random()*10)+'px';$('balls').append(b)}
function say(s){$('status').textContent=s}
$('insert').onclick=()=>{if(state!=='ready')return;state='paid';say('딸깍! 동전이 들어갔어. 손잡이를 돌려줘!');$('insert').disabled=true;$('turn').disabled=false;$('prize').classList.remove('show')};
function turn(){if(state!=='paid')return;state='spinning';$('turn').disabled=true;$('handle').classList.add('spin');say('데굴데굴... 캡슐이 내려오는 중! 🫧');setTimeout(()=>{picked=items[Math.floor(Math.random()*items.length)];state='capsule';$('handle').classList.remove('spin');$('prize').classList.add('show');$('capsule').style.display='block';$('prizeTitle').textContent='캡슐을 눌러 열어봐!';$('note').textContent='';$('again').style.display='none';say('짜잔! 캡슐이 나왔어 🎁')},1050)}
$('turn').onclick=turn;$('handle').onclick=turn;$('handle').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();turn()}};
function openCapsule(){if(state!=='capsule')return;state='opened';$('capsule').style.display='none';$('prizeTitle').textContent=picked[0];$('note').textContent=picked[1];$('again').style.display='inline-block';say('오늘의 편지가 도착했어 💌');let h=JSON.parse(localStorage.getItem('gachaHistory')||'[]');h.unshift(picked[0]);localStorage.setItem('gachaHistory',JSON.stringify(h.slice(0,30)));render()}
$('capsule').onclick=openCapsule;$('capsule').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCapsule()}};
$('again').onclick=()=>{state='ready';$('insert').disabled=false;$('turn').disabled=true;$('prize').classList.remove('show');say('🪙 동전을 넣어 주세요!')};
function render(){let h=JSON.parse(localStorage.getItem('gachaHistory')||'[]');$('history').replaceChildren(...(h.length?h.map(x=>{let li=document.createElement('li');li.textContent=x;return li}):[Object.assign(document.createElement('li'),{textContent:'아직 뽑은 편지가 없어!'})]))}render();
</script></body></html>
