<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>가차 캡슐 · 3D Gacha</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#75465e}body{background:#f9eaf0}canvas{display:block;touch-action:none}.top{position:absolute;top:0;left:0;width:100%;text-align:center;padding:21px 12px;pointer-events:none}.top h1{font-size:clamp(24px,5vw,36px);margin:0;color:#a74b73;letter-spacing:-1px}.top p{margin:5px;color:#aa718b;font-size:13px}.hint{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);width:min(90vw,410px);background:#fffdfbeb;border:1px solid #fff;border-radius:22px;padding:14px 18px;text-align:center;box-shadow:0 12px 40px #a9547d22;font-size:14px;font-weight:700;pointer-events:none}.hint small{display:block;font-size:12px;font-weight:500;margin-top:4px;color:#a67c8e}.reset{position:absolute;right:17px;top:20px;border:1px solid #fff;background:#fff9;border-radius:20px;padding:9px 13px;color:#a54e73;font-weight:700;cursor:pointer}.letter{position:absolute;inset:0;background:#4e244a65;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.letter.open{display:flex}.paper{background:linear-gradient(145deg,#fffefa,#fff3f6);width:min(90vw,420px);padding:32px 26px;border-radius:26px;text-align:center;box-shadow:0 25px 80px #4e244a60;animation:rise .45s both}.paper h2{color:#c85b85}.paper p{line-height:1.9;white-space:pre-line}.paper button{border:0;border-radius:24px;padding:13px 25px;background:#e985a7;color:white;font-weight:800;font-size:15px;cursor:pointer}@keyframes rise{from{transform:translateY(30px) scale(.88);opacity:0}to{transform:none;opacity:1}}.error{display:none;position:absolute;inset:0;place-items:center;padding:20px;text-align:center;background:#fff4f7}
</style></head><body><div id="view"></div><div class="top"><h1>✿ 가차 캡슐 ✿</h1><p>작은 손끝에서 시작되는 오늘의 행운</p></div><button class="reset" id="reset">↻ 처음부터</button><div class="hint" id="hint">🪙 황금 동전을 손가락으로 잡고 투입구까지 끌어봐!<small>화면을 드래그하면 기계를 살짝 둘러볼 수 있어</small></div><div class="letter" id="letter"><div class="paper"><div style="font-size:45px">💌</div><h2 id="title"></h2><p id="message"></p><button id="again">다시 뽑기 ♡</button></div></div><div class="error" id="error">3D 화면을 불러오지 못했어. 인터넷 연결과 WebGL 지원을 확인해 줘.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color('#faedf1');
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);camera.position.set(0,3.3,10.6);camera.lookAt(0,1.9,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;$('view').append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0xd6a9c1,2.5));
function light(x,y,z,power,size){let l=new THREE.DirectionalLight(0xffffff,power);l.position.set(x,y,z);l.castShadow=true;l.shadow.mapSize.set(1024,1024);l.shadow.camera.left=-5;l.shadow.camera.right=5;l.shadow.camera.top=8;l.shadow.camera.bottom=-5;l.shadow.bias=-.0004;scene.add(l)}light(-3,8,6,3);
const pink=mat('#f3a7be',.25),lightpink=mat('#ffd5e1',.24),cream=mat('#fff8f1',.25),dark=mat('#9b5576',.3),gold=new THREE.MeshStandardMaterial({color:'#e9b44f',metalness:.75,roughness:.2}),glass=new THREE.MeshPhysicalMaterial({color:'#fff6fa',metalness:0,roughness:.08,transmission:.7,transparent:true,opacity:.35,thickness:.3,clearcoat:1});
function mat(color,roughness){return new THREE.MeshStandardMaterial({color,roughness,metalness:.05})}
function box(w,h,d,m,x,y,z,r=0){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function sphere(rad,m,x,y,z){let o=new THREE.Mesh(new THREE.SphereGeometry(rad,32,24),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
function cyl(rt,rb,h,m,x,y,z,segments=48){let o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segments),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function rounded(w,h,d,r,m,x,y,z){let s=new THREE.Shape();s.moveTo(-w/2+r,-h/2);s.lineTo(w/2-r,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);s.lineTo(w/2,h/2-r);s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);s.lineTo(-w/2+r,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);s.lineTo(-w/2,-h/2+r);s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);let g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelThickness:r*.35,bevelSize:r*.35,bevelSegments:5,steps:1});g.translate(0,0,-d/2);let o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
let floor=box(200,.12,200,mat('#f9e2eb',.9),0,-.12,0);floor.castShadow=false;
rounded(2.65,2.08,1.75,.3,pink,0,1.17,0);
rounded(2.42,1.82,1.81,.22,lightpink,0,1.21,.03);
rounded(2.1,.92,1.75,.36,pink,0,2.95,0);
rounded(2.04,.68,1.72,.3,cream,0,3.03,.01);
rounded(2.35,1.82,1.58,.4,cream,0,4.02,0);
rounded(2.18,1.65,1.62,.36,glass,0,4.05,.08);
rounded(2.2,.26,1.8,.12,pink,0,4.93,0);
for(let i=0;i<17;i++){let a=i*2.399;let rad=Math.sqrt(i/17)*.75;let x=Math.cos(a)*rad,y=3.45+(i%4)*.3,z=.65+Math.sin(a)*.25;let c=['#ff9ebc','#a9d8ef','#f8d48c','#b6e5c9','#c9b4ef'][i%5];let m=new THREE.MeshPhysicalMaterial({color:c,roughness:.12,clearcoat:1,metalness:.04});sphere(.24,m,x,y,z)}
rounded(.65,.12,.12,.04,dark,-.66,1.76,.99);
rounded(.5,.025,.13,.015,mat('#4e2b41',.2),-.66,1.79,1.065);
const wheel=new THREE.Group();wheel.position.set(.62,1.69,1.01);scene.add(wheel);
let ring=new THREE.Mesh(new THREE.TorusGeometry(.45,.105,20,64),gold);wheel.add(ring);
let plate=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.12,64),cream);plate.rotation.x=Math.PI/2;wheel.add(plate);
let cross1=new THREE.Mesh(new THREE.CapsuleGeometry(.105,.82,8,16),pink);cross1.rotation.z=Math.PI/2;cross1.position.z=.13;wheel.add(cross1);
let cross2=new THREE.Mesh(new THREE.CapsuleGeometry(.105,.82,8,16),pink);cross2.position.z=.13;wheel.add(cross2);
sphere(.14,gold,.62,1.69,1.22);
rounded(.95,.57,.15,.17,dark,0,.65,.99);
rounded(.76,.36,.18,.12,mat('#5e304a',.25),0,.67,1.1);
rounded(1.7,.18,1.65,.08,dark,0,.1,0);
let coin=sphere(.23,gold,-1.75,1.75,1.55);coin.scale.z=.18;
let coinEdge=new THREE.Mesh(new THREE.TorusGeometry(.2,.024,12,50),cream);coin.add(coinEdge);
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,0,1),-1.55),tmp=new THREE.Vector3();
let state='coin',drag=null,startAngle=0,turnTotal=0,prevAngle=0,orbit=0,targetOrbit=0,drop=null,dropT=0;
const hints={coin:'🪙 황금 동전을 잡고 왼쪽 투입구까지 끌어봐!',wheel:'🔄 오른쪽 손잡이를 잡고 원을 그리며 돌려봐!',fall:'🫧 캡슐이 데굴데굴 굴러 나오는 중...',open:'🎁 캡슐을 터치해서 편지를 열어봐!'};
function setState(s){state=s;$('hint').firstChild.textContent=hints[s]||''}
function coords(e){let r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1)}
function hit(e,obj){coords(e);ray.setFromCamera(pointer,camera);return ray.intersectObject(obj,true).length>0}
function hitWheel(e){coords(e);ray.setFromCamera(pointer,camera);let hits=ray.intersectObjects(wheel.children,true);return hits.length>0||hit(e,scene.children.find(o=>o.position&&o.position.x===.62&&o.position.y===1.69&&o.position.z===1.22))}
function angle(e){coords(e);ray.setFromCamera(pointer,camera);let p=new THREE.Vector3();ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,0,1),-1.22),p);return Math.atan2(p.y-1.69,p.x-.62)}
renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);if(state==='coin'&&hit(e,coin)){drag='coin'}else if(state==='wheel'&&hitWheel(e)){drag='wheel';prevAngle=angle(e);turnTotal=0}else if(state==='open'&&drop&&hit(e,drop)){showLetter()}else{drag='orbit';startAngle=e.clientX}});
renderer.domElement.addEventListener('pointermove',e=>{if(drag==='coin'){coords(e);ray.setFromCamera(pointer,camera);if(ray.ray.intersectPlane(plane,tmp)){coin.position.set(THREE.MathUtils.clamp(tmp.x,-2.6,2.6),THREE.MathUtils.clamp(tmp.y,.5,5),1.55);if(Math.abs(tmp.x+.66)<.32&&Math.abs(tmp.y-1.78)<.25){coin.visible=false;drag=null;setState('wheel')}}}else if(drag==='wheel'){let a=angle(e),delta=a-prevAngle;while(delta>Math.PI)delta-=Math.PI*2;while(delta< -Math.PI)delta+=Math.PI*2;turnTotal+=Math.abs(delta);wheel.rotation.z+=delta;if(turnTotal>Math.PI*1.7){drag=null;setState('fall');spawnDrop()}}else if(drag==='orbit'){targetOrbit=THREE.MathUtils.clamp(targetOrbit+(e.clientX-startAngle)*.003,-.3,.3);startAngle=e.clientX}});
renderer.domElement.addEventListener('pointerup',()=>{if(drag==='coin'){coin.position.set(-1.75,1.75,1.55)}drag=null});renderer.domElement.addEventListener('pointercancel',()=>{drag=null});
function spawnDrop(){drop=sphere(.32,new THREE.MeshPhysicalMaterial({color:'#ffb5d0',roughness:.1,clearcoat:1,transparent:true,opacity:.92}),0,.72,1.65);drop.scale.set(.2,.2,.2);dropT=0;setTimeout(()=>setState('open'),950)}
const letters=[['행운의 예감','오늘은 작지만 기분 좋은 일이 기다리고 있어.\n천천히 주변을 둘러봐! 🌷'],['너에게 온 편지','지금의 너도 충분히 멋져.\n오늘 하루는 스스로를 칭찬해 줘. 💌'],['반짝이는 운세','새로운 기회가 슬쩍 인사할지도 몰라.\n용기 있게 손을 흔들어 줘! ✨'],['포근한 위로','모든 걸 완벽하게 해내지 않아도 괜찮아.\n네 속도대로 걸어가면 돼. ☁️'],['기분 좋은 소식','생각지도 못한 순간에 미소 지을 일이 생길 거야. 🍓'],['오늘의 마법','사소한 친절 하나가 누군가의 하루를 바꿀 수 있어. 🧸'],['별빛 편지','조금 멀어 보여도 네 꿈은 여전히 반짝이고 있어. ⭐'],['행운의 색','오늘의 행운 색은 분홍색!\n작은 분홍빛을 찾아봐. 🎀'],['마음의 날씨','잠깐 쉬어도 괜찮아.\n따뜻한 차 한 잔이 행운의 시작이야. 🍵'],['내일의 약속','오늘의 작은 시작이 내일의 큰 웃음이 될 거야. 🌙']];
function showLetter(){let item=letters[Math.floor(Math.random()*letters.length)];$('title').textContent=item[0];$('message').textContent=item[1];$('letter').classList.add('open')}
function reset(){state='coin';coin.visible=true;coin.position.set(-1.75,1.75,1.55);wheel.rotation.z=0;if(drop){scene.remove(drop);drop.geometry.dispose();drop=null}$('letter').classList.remove('open');setState('coin')}
$('again').onclick=reset;$('reset').onclick=reset;
function animate(){requestAnimationFrame(animate);orbit=THREE.MathUtils.lerp(orbit,targetOrbit,.07);camera.position.x=Math.sin(orbit)*10.6;camera.position.z=Math.cos(orbit)*10.6;camera.lookAt(0,2.45,0);if(drop&&state==='fall'){dropT+=.025;drop.scale.setScalar(Math.min(1,dropT*3));drop.position.y=.72+Math.sin(dropT*Math.PI)*.38;drop.rotation.z+=.07}renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<520?47:35;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});dispatchEvent(new Event('resize'));
</script></body></html>
